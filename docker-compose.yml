version: '3.8'

services:
  postgis:
    image: pgrouting/pgrouting:15-3.3-3.4
    container_name: aigeospatial
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geoassist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geoassist_password}
      POSTGRES_DB: ${POSTGRES_DB:-geospatial_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - aigeospatial_postgis_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geoassist}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: aigeospatial_api
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - POSTGRES_HOST=postgis
      - POSTGRES_USER=${POSTGRES_USER:-geoassist}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-geoassist_password}
      - POSTGRES_DB=${POSTGRES_DB:-geospatial_db}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./config:/app/config
    depends_on:
      postgis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Valhalla Routing Engine for accurate pedestrian routing
  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    container_name: aigeospatial_valhalla
    ports:
      - "${VALHALLA_PORT:-8002}:8002"
    volumes:
      - valhalla_tiles:/custom_files
    environment:
      # Download Berlin OSM data and build tiles on first startup
      - tile_urls=https://download.geofabrik.de/europe/germany/berlin-latest.osm.pbf
      - use_tiles_ignore_pbf=True
      - build_elevation=False
      - build_admins=True
      - build_time_zones=True
      - force_rebuild=False
      - serve_tiles=True
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s  # Allow 5 min for initial tile building

volumes:
  aigeospatial_postgis_data:
    external: true
  valhalla_tiles:
    name: aigeospatial_valhalla_tiles
